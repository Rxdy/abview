# Dependabot : une fois par semaine (lundi 6 h), une PR par lot de mises à jour mineures, une PR par mise à jour majeure.
# Chaque PR passe par la CI (tests) avant d'être fusionnée ; les alertes de sécurité arrivent aussi par e-mail.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      npm-mineures:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/client"
    ignore:
      # TypeScript 7 (réécrit en Go) : pas encore pris en charge par vue-tsc / l'outillage ; à revoir plus tard
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      npm-client-mineures:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      npm-server-mineures:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      github-actions-mineures:
        update-types: [minor, patch]
